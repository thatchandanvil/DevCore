<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DevCore</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>DevCore</h2>
      <p>Sign in to access your dashboard or developer portal.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label for="login-name">Full Name</label>
          <input type="text" id="login-name" placeholder="e.g., Marcus Vance" required />
        </div>

        <div class="form-group">
          <label for="login-role">Select Role</label>
          <select id="login-role">
            <option value="admin">System Administrator</option>
            <option value="employee">Developer Portal</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
