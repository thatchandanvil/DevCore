<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - DevCore</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <h2>DevCore</h2>
      <p>Create an account to get started.</p>
      
      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="e.g., Judge Reviewer" required />
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="reviewer@hackathon.com" required />
        </div>

        <div class="form-group">
          <label for="reg-role">Preferred Initial Role</label>
          <select id="reg-role">
            <option value="admin">System Administrator</option>
            <option value="employee">Employee Portal</option>
          </select>
        </div>

        <button type="submit" class="btn-primary">Register & Continue</button>
      </form>
      
      <div class="register-footer">
        <p>Already registered? <a href="login.html">Sign In</a></p>
        <p>Looking for a job? <a href="apply.html">View Open Applications</a></p>
      </div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
